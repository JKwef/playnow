name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  functions:
    name: Edge Functions types and tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Typecheck entry points
        run: >-
          deno check --frozen
          supabase/functions/steam-auth/index.ts
          supabase/functions/steam-library/index.ts
          supabase/functions/rawg-enrich/index.ts
          supabase/functions/delete-account/index.ts

      - name: Unit tests
        run: deno test --frozen supabase/functions/

  quality:
    name: Typecheck, lint, format, tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Unit tests
        run: npm test -- --ci

  android-config:
    name: Android config (prebuild)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prebuild Android (validates config plugins)
        run: npx expo prebuild --platform android --no-install

      - name: Validate app config
        run: npx expo config --type public
